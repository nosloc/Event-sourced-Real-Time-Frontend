postgres {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5442
  port = ${?POSTGRES_PORT}
  user = "prototype"
  password = "prototype"
  database = "prototype"
  max-connections = 16
  ssl = { type = disabled }
  # P4S's own tables (events, checkpoints, ...) live here; the read models stay
  # in `public` (db/init-views.sql)
  schema = "persistent4s"
}

ember {
  host = "localhost"
  host = ${?HTTP_HOST}
  port = 9000
  port = ${?HTTP_PORT}
  app-host = "localhost"
}

# Fault injection (the Faults page): off unless FAULTS_ENABLED=true
faults {
  enabled = false
  enabled = ${?FAULTS_ENABLED}
}
