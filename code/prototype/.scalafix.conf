# Run on the server first: sbt server/scalafixAll
# (it needs the project to compile; the client has `var` in its JS facade and one `null`
# check, so do not run it on the client before relaxing or marking those lines)
rules = [
  LeakingImplicitClassVal
  NoValInForComprehension
  OrganizeImports
  RedundantSyntax
  DisableSyntax
]

OrganizeImports {
  groups = ["java.", "javax.", "scala.", "cats.", "fs2.", "prototype.", "persistent4s.", "*"]
  removeUnused = true
  groupedImports = Merge
  importsOrder = SymbolsFirst
  importSelectorsOrder = SymbolsFirst
  targetDialect = Scala3
}

DisableSyntax {
  noReturns = true
  noWhileLoops = true
  noFinalize = true
  noXml = true
  # Not enabled yet: the client's Chart.js facade needs `var`, and Modal.scala compares with `null`.
  # noVars = true
  # noNulls = true

  regex = [
    {
      id = skunkRawInterpolation
      pattern = "#\\$"
      message = "Raw string splicing (#$) in skunk SQL bypasses parameter encoding and allows SQL injection. Use an encoder ($) instead."
    }
    {
      id = processExecution
      pattern = "scala\\.sys\\.process|Runtime\\.getRuntime\\.exec|\\bProcessBuilder\\b"
      message = "Spawning OS processes risks command injection."
    }
    {
      id = javaDeserialization
      pattern = "\\bObjectInputStream\\b|\\bXMLDecoder\\b"
      message = "Java deserialization of untrusted data can lead to remote code execution. Use a schema-based codec instead."
    }
    {
      id = insecureRandom
      pattern = "scala\\.util\\.Random|java\\.util\\.Random|\\bnew Random\\b|\\bRandom\\.next"
      message = "scala.util.Random / java.util.Random are predictable. Use cats.effect.std.SecureRandom for anything security-related."
    }
    {
      id = weakHash
      pattern = "MessageDigest\\.getInstance\\(\\s*\"(?i:MD2|MD5|SHA-?1)\"\\s*\\)"
      message = "MD5/SHA-1 are broken. Use SHA-256 or stronger."
    }
    {
      id = weakCipher
      pattern = "Cipher\\.getInstance\\(\\s*\"(?i:[^\"]*(DES|RC2|RC4|Blowfish|/ECB/)[^\"]*|AES)\"\\s*\\)"
      message = "Weak cipher or mode (DES/RC4/ECB, or bare \"AES\" which defaults to ECB). Use AES/GCM/NoPadding."
    }
    {
      id = trustAllTls
      pattern = "\\bX509TrustManager\\b|\\bHostnameVerifier\\b|\\bsetHostnameVerifier\\b"
      message = "Custom TLS trust managers / hostname verifiers are a common source of disabled certificate validation."
    }
    {
      id = reflectionAccess
      pattern = "\\.setAccessible\\(\\s*true\\s*\\)"
      message = "setAccessible(true) bypasses encapsulation and JVM access checks."
    }
    {
      id = hardcodedSecret
      pattern = "(?i)\\b(password|passwd|pwd|secret|api_?key|access_?key|private_?key|token)\\w*\\s*(:\\s*[\\w.\\[\\]]+\\s*)?=\\s*\"[^\"]+\""
      message = "Possible hardcoded secret. Load it from configuration / environment instead."
    }
  ]
}
