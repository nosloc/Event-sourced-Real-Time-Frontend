services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      HTTP_HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # TCP-only: succeeds once port 9000 accepts connections
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000'" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    volumes:
      - ./server/src/main/resources/db/init-views.sql:/docker-entrypoint-initdb.d/init-views.sql
    #   - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: prototype
      POSTGRES_PASSWORD: prototype
      POSTGRES_DB: prototype
    ports:
      - "5442:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U prototype -d prototype" ]
      interval: 5s
      timeout: 5s
      retries: 5

