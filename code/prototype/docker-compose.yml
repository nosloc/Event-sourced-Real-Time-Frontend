services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      SERVER_HOST: 0.0.0.0
    healthcheck:
      # TCP-only: succeeds once port 9000 accepts connections
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
