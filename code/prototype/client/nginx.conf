server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The live event stream: one long response that must reach the browser as
    # it is written. Without this, nginx buffers it and closes it after 60 s
    location /api/events/stream {
        proxy_pass http://server:9000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://server:9000;
        proxy_set_header Host $host;
    }

    # SPA fallback: client-side routes (Waypoint) survive a refresh
    location / {
        try_files $uri /index.html;
    }
}
