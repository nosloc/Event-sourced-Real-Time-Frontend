server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:9000;
        proxy_set_header Host $host;
    }

    # SPA fallback: client-side routes (Waypoint) survive a refresh
    location / {
        try_files $uri /index.html;
    }
}
